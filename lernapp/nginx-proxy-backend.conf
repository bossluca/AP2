# Gemeinsame Proxy-Einstellungen für /api (eingebunden in mehrere locations).
proxy_pass http://backend:3001;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Überschreiben statt anhängen: $remote_addr ist dank real_ip (nginx.conf) die echte
# Client-IP. Vom Client mitgeschickte X-Forwarded-For-Werte erreichen das Backend nicht.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_connect_timeout 5s;
proxy_read_timeout 30s;
# Übergroße Requests früh abweisen (Backend limitiert zusätzlich auf 1 MiB).
client_max_body_size 2m;
