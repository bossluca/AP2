# Interne Sitzungsprüfung für `auth_request` (C9): Prüfungsinhalte
# (/assets/examdata-*.js) nur mit gültiger Sitzung ausliefern.
# Eingebunden im internen location-Block `/_sitzung_pruefen` (nginx.conf).
# Das Backend antwortet auf GET /api/auth/me mit 200 (angemeldet) bzw. 401;
# nginx gibt 401/403 unverändert an den Client weiter, alles andere wird 500.
proxy_pass http://backend:3001/api/auth/me;
proxy_http_version 1.1;
# Nur Header zählen – kein Body an den Prüf-Endpunkt.
proxy_pass_request_body off;
proxy_set_header Content-Length "";
# Sitzungs-Cookie des Browsers durchreichen.
proxy_set_header Cookie $http_cookie;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Wie in proxy-backend.conf überschreiben statt anhängen (echte Client-IP).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_connect_timeout 5s;
proxy_read_timeout 10s;
