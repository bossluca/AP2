# Nginx im web-Container: statisches Frontend + Reverse-Proxy /api -> backend.
# TLS/HTTPS terminiert der vorgelagerte Nginx Proxy Manager (dort HSTS aktivieren!).
# Diese Datei landet in /etc/nginx/conf.d/ und steht damit im http-Kontext.

# Nginx-Version nicht verraten (Server-Header/Fehlerseiten).
server_tokens off;

# --- Echte Client-IP hinter dem vorgelagerten Proxy (NPM/Firewall) -----------
# Nur Adressen aus privaten Netzen dürfen X-Forwarded-For setzen. Ohne das
# landen alle Besucher unter der IP des Proxys im selben Rate-Limit-Topf.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# --- Rate-Limits (Schutz vor Flut-Anfragen und Durchprobieren) -------------
# Großzügig genug für eine Schulklasse hinter EINER öffentlichen IP (NAT):
# API allgemein 20 Anfragen/s je IP, Spitzen bis 80 werden durchgelassen.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
# Login/Registrierung/Reset: 30 Anfragen/min je IP (das Backend bremst
# zusätzlich je IP+E-Mail nach 8 Fehlversuchen – das eigentliche Brute-Force-Limit).
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;
# Registrierung (C9, Spam-Schutz): 10 Versuche je IP sofort (Burst 9 + 1), danach
# 1 pro Minute. nginx kennt keine Stunden-Raten (kleinste Einheit r/m); das
# eigentliche Spam-Limit sind die Einladungscodes plus die Backend-Bremse für
# falsche Codes (8 je IP / 15 min). Gezählt wird nur POST – ein leerer Schlüssel
# (andere Methoden) fällt nicht unter die Zone.
map $request_method $register_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $register_limit_key zone=register:10m rate=1r/m;
# Gleichzeitige Verbindungen je IP.
limit_conn_zone $binary_remote_addr zone=conn:10m;
limit_req_status 429;
limit_conn_status 429;

# --- Langsame Clients (Slowloris) früh abbrechen ---------------------------
client_body_timeout 10s;
client_header_timeout 10s;
send_timeout 15s;

# --- Kompression (große JS-/JSON-Chunks ~70 % kleiner über die Leitung) ----
gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    limit_conn conn 60;

    # ES-Module mit .mjs (pdf.js-Worker für „Eigene Karten") brauchen einen
    # JavaScript-MIME-Typ – ältere mime.types kennen die Endung nicht.
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    include /etc/nginx/security-headers.conf;

    # Leichtgewichtiger Container-/Proxy-Healthcheck ohne App- oder Backend-Abhängigkeit.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Gehashte Assets aggressiv cachen (Vite benennt sie mit Hash).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Prüfungsinhalte (C9) nur mit gültiger Sitzung: jede Anfrage auf den
    # Daten-Chunk prüft per auth_request die Sitzung beim Backend
    # (/api/auth/me, Cookie wird durchgereicht). Ohne Sitzung → 401.
    # Regex-Location hat Vorrang vor dem Präfix /assets/ oben.
    location ~ /assets/examdata-[A-Za-z0-9_-]+\.js$ {
        limit_req zone=api burst=80 nodelay;
        auth_request /_sitzung_pruefen;
        # Nur der Browser darf speichern (kein geteilter Proxy/CDN-Cache) und
        # muss vor Wiederverwendung neu fragen. Offline-Kopie hält der Service
        # Worker (eigener Cache, beim Logout gelöscht).
        add_header Cache-Control "private, no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Interner Prüf-Endpunkt für auth_request – von außen nicht aufrufbar.
    location = /_sitzung_pruefen {
        internal;
        include /etc/nginx/auth-sitzung.conf;
    }

    # App-Shell und Service Worker nie langfristig cachen, damit Updates sofort
    # erkannt werden. Gehashte Assets bleiben davon unberührt.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Registrierung (C9): eigenes, sehr enges Limit gegen Konten-Spam (429),
    # zusätzlich zum allgemeinen Auth-Limit. Das Backend bremst falsche
    # Einladungscodes außerdem je IP (8 Fehlversuche / 15 min).
    location = /api/auth/register {
        limit_req zone=register burst=9 nodelay;
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/proxy-backend.conf;
    }

    # Auth-Endpunkte: strenges Rate-Limit gegen Durchprobieren/Registrierungs-Spam.
    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        include /etc/nginx/proxy-backend.conf;
    }

    # Übrige API-Anfragen ans Backend weiterleiten.
    location /api/ {
        limit_req zone=api burst=80 nodelay;
        include /etc/nginx/proxy-backend.conf;
    }

    # SPA-Fallback: HashRouter braucht nur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
