name: CI

# Hält die Suite grün: Frontend (Vitest + Lint + Build + Datencheck) und
# Backend (node:test) + Browser-E2E (Playwright) bei jedem Push/PR. node_modules ist gitignored → npm ci
# installiert reproduzierbar aus den committeten package-lock.json.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Wöchentlich: neue Sicherheitsmeldungen zu Abhängigkeiten auch ohne Push erkennen.
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lernapp)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lernapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lernapp/package-lock.json
      - run: npm ci
      # Nur ausgelieferter Code (ohne Test-Werkzeuge); bricht ab ab "high".
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run validate-data

  e2e:
    name: E2E (Playwright)
    # Fest auf 24.04: ubuntu-latest ist inzwischen 26.04, das Playwright 1.56 nicht
    # unterstützt (Browser-Installation bricht ab, bevor ein Test läuft).
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lernapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lernapp/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: lernapp/test-results/
          retention-days: 7

  backend:
    name: Backend (server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
